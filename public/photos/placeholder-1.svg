<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="50%" stop-color="#3c2266"/>
      <stop offset="100%" stop-color="#542e75"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e8c4c4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8c4c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#skyGrad1)"/>
  <circle cx="300" cy="260" r="180" fill="url(#glow1)"/>
  
  <!-- Decorative stars -->
  <g fill="#d4a853" opacity="0.8">
    <circle cx="100" cy="120" r="3"/>
    <circle cx="490" cy="140" r="2.5"/>
    <circle cx="160" cy="380" r="2.5"/>
    <circle cx="450" cy="360" r="3.5"/>
    <polygon points="300,100 304,112 316,116 304,120 300,132 296,120 284,116 296,112" fill="#ffd56b" opacity="0.7"/>
  </g>

  <!-- Camera / Memory Icon -->
  <g transform="translate(240, 190)" fill="#faf3e8" opacity="0.95">
    <rect x="0" y="25" width="120" height="90" rx="18" fill="none" stroke="#faf3e8" stroke-width="6"/>
    <circle cx="60" cy="70" r="28" fill="none" stroke="#faf3e8" stroke-width="6"/>
    <circle cx="60" cy="70" r="14" fill="#d4a853" opacity="0.8"/>
    <rect x="25" y="10" width="35" height="15" rx="5" fill="#faf3e8"/>
    <circle cx="95" cy="45" r="6" fill="#e85d75"/>
  </g>

  <!-- Romantic floral & heart accents -->
  <text x="300" y="365" font-family="'Playfair Display', Georgia, serif" font-size="28" fill="#faf3e8" font-weight="600" text-anchor="middle" letter-spacing="1">
    Memory One ✨
  </text>
  <text x="300" y="405" font-family="'Inter', sans-serif" font-size="16" fill="#c9a0a0" text-anchor="middle">
    Replace with your photo in public/photos/
  </text>
  <text x="300" y="445" font-size="22" text-anchor="middle">
    🌸 ❤️ 🌸
  </text>
</svg>
