<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2238"/>
      <stop offset="50%" stop-color="#562f4e"/>
      <stop offset="100%" stop-color="#6e3c63"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd56b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#skyGrad4)"/>
  <circle cx="300" cy="260" r="180" fill="url(#glow4)"/>

  <!-- Stars -->
  <g fill="#ffd56b" opacity="0.8">
    <circle cx="100" cy="180" r="3"/>
    <circle cx="500" cy="160" r="3"/>
    <polygon points="460,220 463,228 471,231 463,234 460,242 457,234 449,231 457,228" fill="#ffd56b"/>
  </g>

  <!-- Sun / Golden Moment Motif -->
  <g transform="translate(250, 190)" fill="#ffd56b">
    <circle cx="50" cy="50" r="30" fill="#ffd56b" opacity="0.9"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#faf3e8" stroke-width="3" stroke-dasharray="6,8"/>
    <path d="M50 35 Q50 65 30 65" stroke="#3d2238" stroke-width="3" fill="none"/>
  </g>

  <text x="300" y="365" font-family="'Playfair Display', Georgia, serif" font-size="28" fill="#faf3e8" font-weight="600" text-anchor="middle" letter-spacing="1">
    Memory Four ☀️
  </text>
  <text x="300" y="405" font-family="'Inter', sans-serif" font-size="16" fill="#f7d0b8" text-anchor="middle">
