<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1640"/>
      <stop offset="50%" stop-color="#46225b"/>
      <stop offset="100%" stop-color="#5f2d73"/>
    </linearGradient>
    <radialGradient id="glow6" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c9a0a0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a0a0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#skyGrad6)"/>
  <circle cx="300" cy="260" r="180" fill="url(#glow6)"/>

  <!-- Stars -->
  <g fill="#ffd56b" opacity="0.8">
    <circle cx="110" cy="130" r="3"/>
    <circle cx="490" cy="140" r="3"/>
    <polygon points="300,100 304,110 314,114 304,118 300,128 296,118 286,114 296,110" fill="#ffd56b"/>
  </g>

  <!-- Constellation / Keepsake Motif -->
  <g transform="translate(250, 190)" fill="#faf3e8">
    <circle cx="20" cy="40" r="6" fill="#ffd56b"/>
    <circle cx="50" cy="20" r="8" fill="#ffd56b"/>
    <circle cx="80" cy="50" r="6" fill="#ffd56b"/>
    <circle cx="50" cy="70" r="7" fill="#ffd56b"/>
    <line x1="20" y1="40" x2="50" y2="20" stroke="#faf3e8" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="50" y1="20" x2="80" y2="50" stroke="#faf3e8" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="80" y1="50" x2="50" y2="70" stroke="#faf3e8" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="50" y1="70" x2="20" y2="40" stroke="#faf3e8" stroke-width="2" stroke-dasharray="3,3"/>
  </g>

  <text x="300" y="365" font-family="'Playfair Display', Georgia, serif" font-size="28" fill="#faf3e8" font-weight="600" text-anchor="middle" letter-spacing="1">
    Memory Six 🌟
  </text>
  <text x="300" y="405" font-family="'Inter', sans-serif" font-size="16" fill="#c9a0a0" text-anchor="middle">
    Worth keeping close forever
  </text>
  <text x="300" y="445" font-size="22" text-anchor="middle">
    ✦ ❤️ ✦
  </text>
</svg>
